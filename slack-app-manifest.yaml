display_information:
  name: Sam Bot
  description: Run Codex and Claude Code on your computer from Slack
features:
  agent_view:
    agent_description: Sam Bot connects Slack to Codex and Claude Code on your computer
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Sam Bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - chat:write
      - files:read
      - files:write
      - groups:history
      - im:history
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
